services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
    networks:
      - kuab-network
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    networks:
      - kuab-network
    restart: always

networks:
  kuab-network:
    name: kuab-network
